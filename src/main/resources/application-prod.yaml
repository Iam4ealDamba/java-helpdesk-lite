spring:
  application:
    name: java-helpdesk-lite
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

springdoc:
  swagger-ui:
    path: /swagger.html
  api-docs:
    path: /api-docs

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}