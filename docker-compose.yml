name: helpdesklite

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - helpdesklite-postgres:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=helpdesklite
    networks:
      - helpdesklite

volumes:
  helpdesklite-postgres:

networks:
  helpdesklite:
    external: true

